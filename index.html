<!DOCTYPE html>
<!-- ☃ -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>phantasmagoria ver. 0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jqueryui@1.11.1/jquery-ui.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jqueryui@1.11.1/jquery-ui.structure.css">
  </head>
  <body>
    <div id="music_player" class="whitegrit">
      <div class="window">
        <p>1/8</p>
        <button type="button">×</button>
      </div>
      <div class="details">
        <div class="album-cover">
          <img src="assets/cd.png" style="border: 2px solid; border-color: rgb(89, 89, 89) rgb(17, 17, 17) rgb(17, 17, 17) rgb(89, 89, 89); background-color: rgb(48, 38, 59);">
        </div>
        <div class="text">
          <h2 class="track_name">Song name</h2>
          <h2 class="artist">Artist name</h2>
        </div>
      </div>
      <div class="slider-container">
        <div class="slider">
          <p class="current_time">0:00</p>
          <div class="slider-color"></div>
          <p class="end_time">0:00</p>
        </div>
          <div class="play">
            <img class="backward" src="assets/forward.png" style="transform: scale(0.2)">
            <img class="play_pause_btn" src="assets/play.png" style="transform: scale(0.5)">
            <img class="forward" src="assets/forward.png" style="transform: scale(-0.2)">
        </div>
      </div>
    </div>
    <div id="container" class="blackgrit">
        <div class="div1">
            <img src="assets/logo.png">
            <img src="assets/title.png">
        </div>
        <div class="div2">
          <button type="button" class="row show-button">♫ music player</button>
          <button type="button" class="row">⛾ aeroghurt's web</button>
        </div>
        <div class="div3">
             <img class="kewl" src="assets/ace-dot.png">
             <img class="kewl" src="assets/nique-dot.png">
             <img class="kewl" src="assets/hue-dot.png">
        </div>
        <div class="div4">
            <p>made with godot</p>
            <p>no ai used for visuals</p>
            <p>completely free-to-play</p>
        </div>
        <div class="div5"><p>quote here :p</p></div>
        <div class="div6"><p>another quote here</p></div>
        <div class="div7"><p>another nother quote here</p></div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jqueryui@1.11.1/jquery-ui.js"></script>
    <script src="index.js"></script>
  </body>
</html>
